<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>GraphRAG X-Ray</title>
<script>try{var t=localStorage.getItem("xray-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='4' cy='4' r='2.5' fill='%23888'/%3E%3Ccircle cx='12' cy='6' r='2.5' fill='%23888'/%3E%3Ccircle cx='6' cy='13' r='2.5' fill='%23888'/%3E%3Cpath d='M12 6 6 13' stroke='%23d03b2e' stroke-width='1.6' stroke-dasharray='2 1.5'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#fbfbfd;--raise:#ffffff;--fill:rgba(0,0,0,.035);--fill-2:rgba(0,0,0,.06);
  --ink:#1d1d1f;--ink-2:#6e6e73;--ink-3:#a1a1a6;
  --line:rgba(0,0,0,.08);--line-2:rgba(0,0,0,.15);
  --lost:#d03b2e;--kept:#17875a;--evid:#3056d3;
  --edge:rgba(29,29,31,.10);--lost-faint:rgba(208,59,46,.32);--kept-faint:rgba(23,135,90,.55);
  --node:rgba(29,29,31,.34);--node-core:rgba(29,29,31,.68);
  --hull:rgba(29,29,31,.028);--hull-2:rgba(29,29,31,.06);
  --shadow:0 1px 2px rgba(0,0,0,.05),0 12px 32px rgba(0,0,0,.12);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0d0d0e;--raise:#1c1c1e;--fill:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.085);
    --ink:#f5f5f7;--ink-2:#a1a1a6;--ink-3:#6e6e73;
    --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);
    --lost:#d9534a;--kept:#27966a;--evid:#5a7fe6;
    --edge:rgba(245,245,247,.09);--lost-faint:rgba(217,83,74,.40);--kept-faint:rgba(39,150,106,.62);
    --node:rgba(245,245,247,.28);--node-core:rgba(245,245,247,.62);
    --hull:rgba(245,245,247,.03);--hull-2:rgba(245,245,247,.07);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0d0d0e;--raise:#1c1c1e;--fill:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.085);
  --ink:#f5f5f7;--ink-2:#a1a1a6;--ink-3:#6e6e73;
  --line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);
  --lost:#d9534a;--kept:#27966a;--evid:#5a7fe6;
  --edge:rgba(245,245,247,.09);--lost-faint:rgba(217,83,74,.40);--kept-faint:rgba(39,150,106,.62);
  --node:rgba(245,245,247,.28);--node-core:rgba(245,245,247,.62);
  --hull:rgba(245,245,247,.03);--hull-2:rgba(245,245,247,.07);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--evid);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
.label{font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:40;height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.crumb{font-size:14px;color:var(--ink-2);white-space:nowrap}
.crumb::before{content:"/";margin-right:12px;color:var(--ink-3)}
.spacer{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:15px;color:var(--ink-2)}
.icon-btn:hover{background:var(--fill-2);color:var(--ink)}
.icon-btn svg{display:block}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr) 384px}
.main{min-width:0;padding:24px 40px 32px}
.rail{position:sticky;top:52px;height:calc(100vh - 52px);overflow-y:auto;border-left:1px solid var(--line);padding:28px 28px 48px;scrollbar-width:thin}
@media (max-width:1120px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-left:0;border-top:1px solid var(--line);padding:28px 24px 48px}
  .main{padding:24px 24px 40px}
}

/* ---------- question ---------- */
.question{position:relative;max-width:820px}
.q-trigger{display:flex;align-items:flex-start;gap:8px;margin:6px 0 0 -8px;padding:4px 8px;border-radius:8px;font-size:20px;line-height:27px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.q-trigger:hover{background:var(--fill)}
.q-trigger svg{flex:none;margin-top:9px;color:var(--ink-2);transition:transform .2s var(--ease)}
.q-trigger[aria-expanded="true"] svg{transform:rotate(180deg)}
.q-meta{margin-top:4px;font-size:13px;line-height:18px;color:var(--ink-2)}
.menu{position:absolute;z-index:30;top:calc(100% + 8px);left:-8px;width:min(580px,calc(100vw - 48px));background:var(--raise);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:grid;gap:2px}
.menu button{display:grid;gap:2px;padding:10px 12px;border-radius:8px}
.menu button:hover,.menu button:focus-visible{background:var(--fill-2);outline:none}
.mi-text{font-size:14px;line-height:20px}
.menu button[aria-selected="true"] .mi-text{font-weight:600}
.mi-meta{font-size:12px;line-height:16px;color:var(--ink-2)}
.menu-list{display:grid;gap:2px}
.menu-ask{display:flex;align-items:center;gap:6px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}
.menu-ask input{flex:1;min-width:0;height:36px;padding:0 10px;border:0;border-radius:8px;background:var(--fill);color:var(--ink);font:400 14px/1.4 var(--sans)}
.menu-ask input::placeholder{color:var(--ink-3)}
.menu-ask input:focus{outline:none;background:var(--fill-2)}
.menu .ask-go{display:inline-grid;place-items:center;width:32px;height:32px;padding:0;border-radius:16px;color:var(--ink-2)}
.menu .ask-go:hover,.menu .ask-go:focus-visible{background:var(--fill-2);color:var(--ink)}
.ask-hint{margin:6px 12px 2px;font-size:12px;line-height:16px;color:var(--ink-3)}
.ask-hint.bad{color:var(--lost)}

/* ---------- graph stage ---------- */
.stage{position:relative;height:clamp(400px,calc(100vh - 408px),800px);margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas{position:absolute;inset:0;display:block;cursor:grab}
.stage canvas.panning{cursor:grabbing}
.stage-label{position:absolute;top:14px;left:16px;font-size:13px;line-height:18px;font-weight:500;color:var(--ink-2);pointer-events:none}
.key{position:absolute;left:16px;bottom:14px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;line-height:16px;color:var(--ink-2);pointer-events:none}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.zoom{position:absolute;right:14px;bottom:12px;display:flex;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden}
.zoom button{width:32px;height:28px;display:grid;place-items:center;color:var(--ink-2)}
.zoom button+button{border-left:1px solid var(--line)}
.zoom button:hover:not(:disabled){background:var(--fill-2);color:var(--ink)}
.zoom button:disabled{color:var(--ink-3);opacity:.6}
.status{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;padding:24px;text-align:center;font-size:13px;color:var(--ink-2);background:var(--bg)}
.status-title{font-size:15px;font-weight:600;color:var(--ink)}
.btn{margin-top:8px;height:30px;padding:0 14px;border-radius:15px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:500}

/* ---------- level + metrics ---------- */
.lower{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:56px;margin-top:22px;align-items:start}
@media (max-width:900px){.lower{grid-template-columns:1fr;gap:32px}}
.level-desc{margin-top:4px;font-size:13px;line-height:18px;color:var(--ink-2);min-height:18px}
.stepper{position:relative;height:46px;margin-top:16px;touch-action:none;cursor:pointer;outline:none}
.stepper:focus-visible .thumb{box-shadow:0 0 0 1px var(--line-2),0 0 0 4px color-mix(in srgb,var(--evid) 35%,transparent)}
.stepper-inner{position:absolute;left:9px;right:9px;top:0;height:20px}
.track{position:absolute;left:0;right:0;top:9px;height:2px;border-radius:1px;background:var(--line-2)}
.track-fill{position:absolute;left:0;top:0;bottom:0;border-radius:1px;background:var(--ink);transition:width .35s var(--ease)}
.stop{position:absolute;top:6px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--bg);border:2px solid var(--line-2);transition:border-color .2s}
.stop.on{border-color:var(--ink);background:var(--ink)}
.thumb{position:absolute;top:0;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:var(--raise);box-shadow:0 0 0 1px var(--line-2),0 1px 3px rgba(0,0,0,.2);transition:left .35s var(--ease)}
.stop-labels{position:absolute;left:9px;right:9px;top:26px;height:20px}
.stop-labels button{position:absolute;top:0;transform:translateX(-50%);padding:0 4px;border-radius:4px;font-size:12px;line-height:18px;color:var(--ink-2);white-space:nowrap}
.stop-labels button:first-child{transform:translateX(-9px)}
.stop-labels button:last-child{transform:translateX(calc(-100% + 9px))}
.stop-labels button:hover{color:var(--ink)}
.stop-labels button[aria-pressed="true"]{color:var(--ink);font-weight:500}
.metrics{width:100%;border-collapse:collapse}
.metrics th{padding:0 0 8px 20px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2);text-align:right;white-space:nowrap}
.metrics th:first-child{padding-left:0;text-align:left}
.metrics td{padding:9px 0 9px 20px;border-top:1px solid var(--line);text-align:right;font-size:15px;line-height:20px;font-variant-numeric:tabular-nums;white-space:nowrap}
.metrics td:first-child{padding-left:0;text-align:left;font-size:14px;white-space:normal}
.metrics .o{color:var(--ink-2)}
.metrics .p{font-weight:600}
.metrics .d{font-size:13px;color:var(--kept)}
.metrics .d.neg{color:var(--lost)}
.metrics-foot{margin-top:8px;font-size:12px;line-height:16px;color:var(--ink-2)}

/* ---------- rail: comparison ---------- */
.compare{display:grid;gap:4px;margin:10px -12px 0}
.method{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:8px 12px;width:100%;padding:12px;border-radius:12px;transition:background-color .2s}
.method:hover{background:var(--fill)}
.method[aria-checked="true"]{background:var(--fill-2)}
.m-name{font-size:15px;line-height:20px;font-weight:600;letter-spacing:-.01em;color:var(--ink-2);transition:color .2s}
.method[aria-checked="true"] .m-name{color:var(--ink)}
.verdict{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:18px;font-weight:500;white-space:nowrap}
.verdict svg{width:14px;height:14px}
.verdict.correct{color:var(--kept)}.verdict.incorrect{color:var(--lost)}.verdict.partial{color:var(--ink-2)}
.meter{grid-column:1/-1;display:flex;gap:3px;margin-top:2px}
.meter i{flex:1;height:6px;border-radius:3px;background:var(--line-2);transition:background-color .35s var(--ease)}
.meter i.ok{background:var(--evid)}.meter i.rec{background:var(--kept)}.meter i.lost{background:var(--lost)}.meter i.miss{background:var(--ink-3)}
.m-caption{grid-column:1/-1;font-size:12px;line-height:16px;color:var(--ink-2)}

/* ---------- rail: context ---------- */
.context{margin-top:24px;padding-top:24px;border-top:1px solid var(--line)}
.block+.block{margin-top:24px}
.answer{margin-top:8px;font-size:14px;line-height:21px}
.expected{margin-top:8px;font-size:13px;line-height:19px;color:var(--ink-2)}
.hops,.rows{list-style:none;margin:6px -8px 0;padding:0;display:grid;gap:2px}
.hop{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:start;width:100%;padding:8px;border-radius:8px}
.hop:hover,.row:hover{background:var(--fill-2)}
.glyph{display:grid;place-items:center;width:16px;height:20px}
.hop-ents{display:block;font-size:14px;line-height:20px;font-weight:500}
.arr{color:var(--ink-3);font-weight:400;margin:0 4px}
.hop-rel{display:block;font-size:13px;line-height:18px;color:var(--ink-2)}
.hop-state{font-size:12px;line-height:20px;color:var(--ink-2);white-space:nowrap}
.hop-state.lost,.m.lost,.st-word.lost{color:var(--lost)}
.hop-state.rec,.m.rec,.st-word.rec{color:var(--kept)}
.disclosure{display:flex;align-items:center;justify-content:space-between;gap:8px;width:calc(100% + 16px);margin:0 -8px;padding:8px;border-radius:8px;font-size:13px;line-height:18px;color:var(--ink-2)}
.disclosure:hover{background:var(--fill-2);color:var(--ink)}
.disclosure svg{flex:none;transition:transform .2s var(--ease)}
.disclosure[aria-expanded="true"] svg{transform:rotate(90deg)}
.row{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:baseline;width:100%;padding:8px;border-radius:8px}
.row-edge{grid-template-columns:16px minmax(0,1fr) auto;align-items:start}
.row .id{font:12px/18px var(--mono);color:var(--ink-2)}
.row .t{font-size:13px;line-height:18px}
.row .sub{color:var(--ink-2)}
.row .m{font-size:12px;line-height:18px;color:var(--ink-2);white-space:nowrap}
.more{padding:6px 8px;font-size:12px;color:var(--ink-2)}

/* ---------- rail: inspector ---------- */
.back{display:inline-flex;align-items:center;gap:2px;margin-left:-6px;padding:4px 10px 4px 4px;border-radius:6px;font-size:13px;line-height:18px;color:var(--ink-2)}
.back:hover{background:var(--fill-2);color:var(--ink)}
.i-kicker{margin-top:16px;font-size:12px;line-height:16px;font-weight:500;color:var(--ink-2)}
.i-title{margin-top:4px;font-size:17px;line-height:23px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.i-sub{margin-top:2px;font-size:14px;line-height:20px;color:var(--ink-2)}
.i-meta{margin-top:6px;font-size:12px;line-height:16px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.i-section{margin-top:24px}
.i-p{margin-top:6px;font-size:13px;line-height:19px;color:var(--ink-2)}
.state-line{display:grid;grid-template-columns:70px 16px minmax(0,1fr);gap:8px;align-items:start;margin-top:12px;font-size:13px;line-height:20px}
.state-line .who{color:var(--ink-2)}
.state-line .st-word{font-weight:500}
.state-line+.i-p{margin-left:94px;margin-top:2px}
.levels-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;line-height:18px}
.levels-table th{padding:0 0 6px;font-size:12px;font-weight:500;color:var(--ink-2);text-align:left}
.levels-table td{padding:7px 8px 7px 0;border-top:1px solid var(--line);vertical-align:top}
.levels-table tr.cur td{font-weight:600}
.lvl-link{color:inherit;border-radius:4px}
.lvl-link:hover{text-decoration:underline;text-underline-offset:3px}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.st.lost i{background:var(--lost)}.st.rec i{background:var(--kept)}
.budget{position:relative;height:6px;margin-top:10px;border-radius:3px;background:var(--fill-2);overflow:hidden}
.budget b{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2)}
.budget s{position:absolute;top:0;bottom:0;background:var(--lost)}
.budget em{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:var(--bg)}
.budget-caption{display:flex;justify-content:space-between;gap:12px;margin-top:6px;font-size:12px;line-height:16px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.budget-caption .over{color:var(--lost)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:20px;margin-top:6px;font-size:13px;line-height:18px}
.kv span{padding:7px 0;border-top:1px solid var(--line)}
.kv .h{padding-top:0;border-top:0;font-size:12px;font-weight:500;color:var(--ink-2)}
.kv .n{text-align:right;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="4" cy="4" r="2.2" fill="currentColor"/><circle cx="14" cy="6" r="2.2" fill="currentColor"/><circle cx="7" cy="14" r="2.2" fill="currentColor"/><path d="M4 4 14 6M4 4l3 10" stroke="currentColor" stroke-width="1.2"/><path d="M14 6 7 14" stroke="var(--lost)" stroke-width="1.4" stroke-dasharray="2 2"/></svg>
    GraphRAG X-Ray
  </div>
  <span class="crumb">Middlemarch</span>
  <span class="spacer"></span>
  <button type="button" class="icon-btn" id="themeBtn"><svg class="i-sun" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.3v1.5M8 13.2v1.5M1.3 8h1.5M13.2 8h1.5M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M12.6 3.4l-1.1 1.1M4.5 11.5l-1.1 1.1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><svg class="i-moon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.3 9.7A5.7 5.7 0 0 1 6.3 2.7 5.7 5.7 0 1 0 13.3 9.7Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg></button>
</header>

<div class="app">
  <main class="main">
    <div class="question">
      <p class="label">Question</p>
      <button type="button" class="q-trigger" id="qTrigger" aria-haspopup="listbox" aria-expanded="false" aria-controls="qMenu">
        <span id="qText">Loading…</span>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <p class="q-meta" id="qMeta"></p>
      <div class="menu" id="qMenu" hidden>
        <div class="menu-list" id="qList" role="listbox" aria-label="Featured questions"></div>
        <form class="menu-ask" id="askForm" autocomplete="off">
          <input id="askInput" type="text" placeholder="Ask your own question…" aria-label="Ask your own question" aria-describedby="askHint">
          <button type="submit" class="ask-go" aria-label="Trace this question"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7h9M8 3.5 11.5 7 8 10.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </form>
        <p class="ask-hint" id="askHint"></p>
      </div>
    </div>

    <div class="stage" id="stage">
      <canvas id="graph" role="img" aria-label="Knowledge graph of Middlemarch"></canvas>
      <div class="stage-label" id="stageLabel" aria-live="polite"></div>
      <div class="key" aria-hidden="true">
        <span><svg width="20" height="8"><line x1="1" y1="4" x2="19" y2="4" stroke="var(--ink-3)" stroke-width="1.5"/></svg>In a summary</span>
        <span><svg width="20" height="8"><line x1="1" y1="4" x2="19" y2="4" stroke="var(--lost)" stroke-width="1.8" stroke-dasharray="4 3"/></svg>Lost</span>
        <span><svg width="20" height="8"><line x1="1" y1="4" x2="19" y2="4" stroke="var(--kept)" stroke-width="2"/></svg>Recovered</span>
        <span><svg width="20" height="8"><line x1="1" y1="4" x2="19" y2="4" stroke="var(--evid)" stroke-width="2.5" stroke-linecap="round"/></svg>Evidence</span>
      </div>
      <div class="zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button type="button" id="zoomIn" aria-label="Zoom in"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6h8M6 2v8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <button type="button" id="zoomFit" aria-label="Fit graph to view"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 4V1.5H4M8 1.5h2.5V4M10.5 8v2.5H8M4 10.5H1.5V8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <div class="status" id="stageStatus"><p>Building index…</p></div>
    </div>

    <div class="lower">
      <section aria-labelledby="levelLabel">
        <h2 class="label" id="levelLabel">Index level</h2>
        <p class="level-desc" id="levelDesc"></p>
        <div class="stepper" id="stepper" role="slider" tabindex="0" aria-labelledby="levelLabel" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0">
          <div class="stepper-inner">
            <div class="track"><div class="track-fill" id="trackFill"></div></div>
            <span class="stop" style="left:0%"></span><span class="stop" style="left:33.333%"></span><span class="stop" style="left:66.667%"></span><span class="stop" style="left:100%"></span>
            <span class="thumb" id="thumb"></span>
          </div>
          <div class="stop-labels" id="stopLabels">
            <button type="button" tabindex="-1" data-level="0" style="left:0%">Leaf</button>
            <button type="button" tabindex="-1" data-level="1" style="left:33.333%">Community</button>
            <button type="button" tabindex="-1" data-level="2" style="left:66.667%">Higher community</button>
            <button type="button" tabindex="-1" data-level="3" style="left:100%">Root</button>
          </div>
        </div>
      </section>
      <section aria-labelledby="metricsLabel">
        <table class="metrics">
          <thead><tr><th id="metricsLabel">All questions</th><th>Original</th><th>Proposed</th><th>Change</th></tr></thead>
          <tbody id="metricsBody"></tbody>
        </table>
        <p class="metrics-foot" id="metricsFoot"></p>
      </section>
    </div>
  </main>

  <aside class="rail" id="rail" aria-label="Question details">
    <p class="label">Evidence retrieved for this question</p>
    <div class="compare" id="compare" role="radiogroup" aria-label="Index shown in the graph">
      <button type="button" class="method" id="mOrig" role="radio" aria-checked="true" data-action="method" data-method="orig">
        <span class="m-name">Original GraphRAG</span><span class="verdict"></span><span class="meter" aria-hidden="true"></span><span class="m-caption"></span>
      </button>
      <button type="button" class="method" id="mProp" role="radio" aria-checked="false" data-action="method" data-method="prop" tabindex="-1">
        <span class="m-name">Proposed method</span><span class="verdict"></span><span class="meter" aria-hidden="true"></span><span class="m-caption"></span>
      </button>
    </div>
    <div class="context" id="context" aria-live="polite"></div>
  </aside>
</div>

<script src="data.js"></script>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
